version: '3.9'

services:

  flask-app:
    build:
      context: .
      dockerfile: Dockerfile.flask
    ports:
      - "5000:5000"
    depends_on:
      - fastapi-app
    environment:
      - API_URL=http://fastapi-app:8000/predict   

  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"